# Dependabot の設定。
#
# 脆弱性の即時アラートと、緊急のセキュリティ更新PRは、このファイルではなく
# リポジトリの Settings → Code security で「Dependabot alerts」
# 「Dependabot security updates」をONにすると動く。
# このファイルは定期的な更新提案と、PRのまとめ方を定義する。
version: 2

updates:
  - package-ecosystem: npm
    # アプリ本体はワークスペース直下ではなく PalpalettHomePage/ にある
    directory: /PalpalettHomePage
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    commit-message:
      prefix: "chore(deps)"
    groups:
      # next と eslint-config-next、react と react-dom は同じバージョンで
      # 揃っていないと壊れる。別々のPRに分かれないよう1つにまとめる。
      nextjs-react:
        patterns:
          - "next"
          - "eslint-config-next"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # セキュリティ更新でも同じ組み合わせは一緒に上げる
      nextjs-react-security:
        applies-to: security-updates
        patterns:
          - "next"
          - "eslint-config-next"
          - "react"
          - "react-dom"
      # 開発用ツールのマイナー・パッチ更新は1つのPRにまとめて数を抑える
      dev-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # 型定義は実行環境の Node（CI・ローカル・Vercel とも 24）に合わせる。
      # 新しいメジャーの型を入れると、24 に無い API を使っても型チェックで気づけない。
      # Node 本体を上げるときに、あわせて手動で上げる。
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # eslint-config-next が同梱するプラグイン（eslint-plugin-import 等）が
      # ESLint 9 までしか対応していない（ESLint 10 では npm が peer 依存を強制上書きする）。
      # Next.js 側が ESLint 10 に対応したら、この ignore を外して更新する。
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  # CIで使う GitHub Actions 自体の更新
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Asia/Tokyo
    commit-message:
      prefix: "chore(ci)"
